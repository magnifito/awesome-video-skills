  <rect x="0" y="810" width="1920" height="270" fill="#2b1c17"/>
  <rect x="958" y="270" width="4" height="540" fill="#f0eadf"/>
  <g font-family="Geist" fill="#f0eadf" text-anchor="middle">
    <text x="480" y="168" font-size="56" font-weight="700">HyperFrames</text>
    <text x="480" y="224" font-size="26" font-weight="400" fill="#d8c6b4">kinetic-typography · isometric-feature-grid · brand-title</text>
    <text x="1440" y="168" font-size="56" font-weight="700">Motion</text>
