<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1e8"/><stop offset="1" stop-color="#e6d9ca"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <g font-family="Geist">
    <text x="140" y="92" font-size="46" font-weight="700" fill="#2b1c17">Dialogue cleanup</text>
    <text x="1780" y="92" font-size="24" fill="#7a584c" text-anchor="end">Synthetic voice-like tone track, no real speech</text>

    <text x="140" y="168" font-size="30" font-weight="600" fill="#2b1c17">Before<tspan dx="14" font-weight="400" fill="#7a584c">raw take: mains hum, hiss and clicks</tspan></text>
    <rect x="140" y="190" width="1640" height="320" rx="24" fill="#fbf8f3" stroke="#d8c6b4" stroke-width="3"/>

    <text x="140" y="618" font-size="30" font-weight="600" fill="#2b1c17">After<tspan dx="14" font-weight="400" fill="#7a584c">declick, EQ, noise gate, compressor</tspan></text>
    <rect x="140" y="640" width="1640" height="320" rx="24" fill="#fbf8f3" stroke="#d8c6b4" stroke-width="3"/>

    <text x="140" y="1028" font-size="24" fill="#573a30">declick  →  eq rumble-reduction  →  noise-gate −26 dB  →  compress-audio broadcast-master</text>
  </g>
</svg>
