<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Bands above and below the two 960x540 halves from mgvideo multicam, plus a divider -->
  <rect x="0" y="0" width="1920" height="270" fill="#2b1c17"/>
  <rect x="0" y="810" width="1920" height="270" fill="#2b1c17"/>
  <rect x="958" y="270" width="4" height="540" fill="#f0eadf"/>
  <g font-family="Geist" fill="#f0eadf" text-anchor="middle">
    <text x="480" y="168" font-size="56" font-weight="700">Calm, static</text>
    <text x="480" y="224" font-size="28" font-weight="400" fill="#d8c6b4">tempo "calm" · camera_style "static"</text>
    <text x="1440" y="168" font-size="56" font-weight="700">Punchy, drifting</text>
    <text x="1440" y="224" font-size="28" font-weight="400" fill="#d8c6b4">tempo "punchy" · camera_style "subtle_drift"</text>
    <text x="960" y="900" font-size="30" font-weight="600">Same film, same scene plan: only motion_preferences in brand.json changed</text>
    <text x="960" y="950" font-size="26" font-weight="400" fill="#d8c6b4">Punchy staggers faster, rises further and overshoots; drift slowly scales the frame from 97% to 103%</text>
  </g>
  <circle cx="960" cy="1010" r="7" fill="#8acf31"/>
</svg>
