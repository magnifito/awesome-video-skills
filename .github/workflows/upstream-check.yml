name: Upstream Source Check

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstreams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Upstream Discovery Check
        run: npx tsx packages/cli/src/bin/mgvideo.ts upstream check
