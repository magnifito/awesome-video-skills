name: Render & Fixture Evaluations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Build
        run: npm run build

      - name: Run Diagnostics
        run: npx tsx packages/cli/src/bin/mgvideo.ts doctor

      - name: Run Full Evaluation Suite
        run: npx tsx evaluations/runner.ts

