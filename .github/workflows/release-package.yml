name: Skill Packaging & Release Gates

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Package Canonical Skills
        run: npx tsx tools/packaging/packager.ts

      - name: Verify Packaging Allowlist
        run: |
          test -f dist/packaged-skills/antigravity/skills-manifest.json
          test -f dist/packaged-skills/claude/skills-manifest.json
          test -f dist/packaged-skills/codex/skills-manifest.json
          echo "Packaging allowlist verified for Antigravity, Claude, and Codex."
